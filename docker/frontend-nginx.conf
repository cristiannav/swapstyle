# Cabeceras compartidas. Ojo: en nginx un `add_header` dentro de un location
# descarta los heredados del server, así que las que importan en cada location
# se repiten explícitamente.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  # No delatar la versión de nginx en las respuestas ni en las páginas de error.
  server_tokens off;

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # would keep serving the old bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    # Lo único que aporta seguridad en un .js/.css: que el browser no adivine
    # el Content-Type y termine ejecutando algo que no debía.
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # El bundle de Vite se sirve como archivo propio, así que no hace falta
    # 'unsafe-inline' en script-src: eso es lo que corta un XSS reflejado.
    # style-src sí lo necesita porque framer-motion escribe estilos inline.
    # ponytail: connect-src queda en `https: wss:` porque VITE_API_URL se
    # resuelve en build; si el backend queda en un dominio fijo, reemplazar
    # por ese origen y listo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }
}
