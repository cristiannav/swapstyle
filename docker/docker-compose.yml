services:
  # Opt-in only (`--profile db`). By default the stack uses the HOST's native
  # PostgreSQL via host.docker.internal, so this service is NOT started by a
  # plain `docker compose up -d` and never competes for host port 5432.
  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: swapstyle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swapstyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swapstyle_dev}
      POSTGRES_DB: ${POSTGRES_DB:-swapstyle}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swapstyle}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swapstyle-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      target: production
    container_name: swapstyle-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Reach the host's native PostgreSQL (where the swapstyle DB + data live).
      # Use `--profile db` and set POSTGRES_HOST=postgres if you want the
      # fully-dockerized database instead.
      POSTGRES_HOST: host.docker.internal
      REDIS_HOST: redis
    extra_hosts:
      # Required on Linux for host.docker.internal to resolve to the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: production
      # VITE_* se inlinean en el bundle en build time, no en runtime.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001}
    container_name: swapstyle-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
